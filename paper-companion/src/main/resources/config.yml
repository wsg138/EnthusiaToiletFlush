# EnthusiaToiletFlush Paper companion
#
# Velocity is the only schedule owner. A non-empty legacy restart-times list
# makes this plugin fail startup so two independent restart clocks cannot run.
restart-times: []

# Address this backend uses to reach the Velocity Minecraft listener. Keep this
# path on loopback or a private/firewalled network whenever possible.
proxy-host: "127.0.0.1"
proxy-port: 25565

# Must exactly match this backend's name in Velocity's server registry and in
# network-restart.servers.
server-id: "CHANGE_ME"

# Signed heartbeat and acknowledged restart-delivery polling interval.
arm-poll-seconds: 5

# Shared HMAC secret. Either set the same QUEUE_RESTART_CONTROL_SECRET
# environment variable on Velocity and every Paper backend, or replace this
# placeholder with the same quoted 32-256 byte random value in every config.
# Rotating it requires a coordinated restart of Velocity and all companions.
control-secret: "${QUEUE_RESTART_CONTROL_SECRET}"
maximum-clock-skew-seconds: 45
