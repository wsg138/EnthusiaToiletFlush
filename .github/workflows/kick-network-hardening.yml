name: apply and validate network hardening

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/harden-network-restart'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/harden-network-restart
          fetch-depth: 0

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Apply reviewed patch
        run: |
          python3 .github/apply_network_hardening.py
          rm -f .github/apply_network_hardening.py .network-hardening-trigger

      - name: Validate modified tree
        run: |
          chmod +x ./gradlew
          git diff --check
          ./gradlew check shadowJar --no-daemon

      - name: Commit validated source changes
        run: |
          git checkout -- gradlew .github/workflows/release.yml
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "refusing to push workflow-file changes with GITHUB_TOKEN"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Harden network restart failure handling [network-hardening-applied]"
          git push origin HEAD:agent/harden-network-restart
