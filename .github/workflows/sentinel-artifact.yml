name: Sentinel artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build and test Paper companion
        run: |
          chmod +x gradlew
          ./gradlew :paper-companion:check :paper-companion:shadowJar --no-daemon -PreleaseVersion=9.8.7
      - name: Stage stable Sentinel artifact
        run: |
          cp paper-companion/build/libs/paper-companion-9.8.7.jar plugin.jar
          jar tf plugin.jar | grep -Fxq 'plugin.yml'
      - name: Upload Sentinel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enthusiatoiletflush-sentinel-paper
          path: plugin.jar
          if-no-files-found: error
          retention-days: 14
