name: apply and validate drain timing fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-drain-timing-and-denials'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/fix-drain-timing-and-denials
          fetch-depth: 0

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Apply reviewed source payload
        run: |
          cat .github/drain-fix-parts/part* > /tmp/drain-fix.b64
          base64 --decode /tmp/drain-fix.b64 > /tmp/drain-fix.tar.gz
          tar -xzf /tmp/drain-fix.tar.gz
          rm -rf .github/drain-fix-parts
          python3 - <<'PY'
          from pathlib import Path

          plugin = Path("velocity/src/main/kotlin/com/badgersmc/queuerestart/velocity/QueueRestartPlugin.kt")
          text = plugin.read_text()
          old = "        val networkControl = VelocityNetworkControl(proxy) { cfgSnapshot().accessMessages }"
          new = """        val networkControl = VelocityNetworkControl(
              proxy = proxy,
              accessMessages = { cfgSnapshot().accessMessages },
          )"""
          if old not in text:
              raise SystemExit("expected network control wiring not found")
          plugin.write_text(text.replace(old, new, 1))

          build = Path("velocity/build.gradle.kts")
          text = build.read_text()
          old = """    testImplementation(project(\":common\"))
              testImplementation(\"com.lemonappdev:konsist:0.17.3\")"""
          new = """    testImplementation(project(\":common\"))
              testImplementation(\"com.velocityctd:velocity-api:3.5.0-SNAPSHOT\")
              testImplementation(\"com.lemonappdev:konsist:0.17.3\")"""
          if old not in text:
              raise SystemExit("expected test dependency block not found")
          build.write_text(text.replace(old, new, 1))

          test = Path("velocity/src/test/kotlin/com/badgersmc/queuerestart/velocity/infrastructure/config/ConfigurateConfigAdapterTest.kt")
          text = test.read_text()
          old = 'Regex("(?ms)^access-messages:\\n(?:  .+\\n){4}")'
          new = 'Regex("(?m)^access-messages:\\n(?:  .+\\n){4}")'
          if old not in text:
              raise SystemExit("expected access-messages fixture regex not found")
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Validate modified tree
        run: |
          chmod +x ./gradlew
          git diff --check
          ./gradlew check shadowJar --no-daemon

      - name: Commit validated source changes
        run: |
          git checkout -- gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "refusing to push workflow-file changes with GITHUB_TOKEN"
            exit 1
          fi
          git diff --cached --check
          git commit -m "Start backend drain at T-0 and customize access denials"
          git push origin HEAD:agent/fix-drain-timing-and-denials
