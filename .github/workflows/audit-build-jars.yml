name: audit-build-jars

on:
  push:
    branches:
      - agent/audit-build-30ca316

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Test and build exact reviewed source
        run: |
          chmod +x ./gradlew
          ./gradlew clean :velocity:check :velocity:shadowJar :paper-companion:check :paper-companion:shadowJar --no-daemon -PreleaseVersion=0.1.4-review.30ca316
          mkdir -p dist
          cp velocity/build/libs/velocity-0.1.4-review.30ca316.jar dist/EnthusiaToiletFlush-Velocity-0.1.4-review.30ca316.jar
          cp paper-companion/build/libs/paper-companion-0.1.4-review.30ca316.jar dist/EnthusiaToiletFlush-Paper-Companion-0.1.4-review.30ca316.jar
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          unzip -p dist/EnthusiaToiletFlush-Velocity-*.jar velocity-plugin.json
          unzip -p dist/EnthusiaToiletFlush-Paper-Companion-*.jar plugin.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-jars-30ca316
          path: dist/
          retention-days: 1
