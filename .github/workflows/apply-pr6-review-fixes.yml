name: apply PR 6 review fixes

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/address-pr6-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/address-pr6-review
          fetch-depth: 0

      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Apply reviewed source payload
        run: |
          cat \
            .github/pr6-review-fix/part00 \
            .github/pr6-review-fix/part01 \
            .github/pr6-review-fix/part02 \
            .github/pr6-review-fix/part03 \
            .github/pr6-review-fix/rem00 \
            .github/pr6-review-fix/rem01 \
            .github/pr6-review-fix/rem02 \
            .github/pr6-review-fix/rem03 \
            .github/pr6-review-fix/rem04 > /tmp/pr6-fix.b64
          base64 --decode /tmp/pr6-fix.b64 > /tmp/pr6-fix.tar.gz
          echo '3bd8300046a5fde6450539554efada535319cac41ebd03a7b53305cdaa8b60f7  /tmp/pr6-fix.tar.gz' | sha256sum --check
          tar -xzf /tmp/pr6-fix.tar.gz
          rm -rf .github/pr6-review-fix

      - name: Validate modified tree
        run: |
          chmod +x ./gradlew
          git diff --check
          ./gradlew check :velocity:shadowJar :paper-companion:shadowJar --no-daemon
          ./gradlew clean :velocity:shadowJar :paper-companion:shadowJar --no-daemon -PreleaseVersion=9.8.7
          unzip -p velocity/build/libs/EnthusiaToiletFlush-Velocity-9.8.7.jar velocity-plugin.json | grep -F '"version":"9.8.7"'
          unzip -p paper-companion/build/libs/EnthusiaToiletFlush-PaperCompanion-9.8.7.jar plugin.yml | grep -F 'version: 9.8.7'

      - name: Commit validated fixes
        run: |
          git checkout -- gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Address upstream restart review findings"
          git push origin HEAD:agent/address-pr6-review
